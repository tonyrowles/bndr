name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and inspect
        env:
          BNDR_CHROMIUM: /usr/bin/google-chrome
        run: |
          "$BNDR_CHROMIUM" --version
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          sh -n install.sh scripts/release.sh
      - name: Build Linux releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/release.sh "$VERSION"
          scan_dir=$(mktemp -d)
          tar -xzf dist/bndr_linux_amd64.tar.gz -C "$scan_dir" bndr
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$scan_dir/bndr"
      - name: Smoke test the installer
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          install_root=$(mktemp -d)
          export XDG_CONFIG_HOME="$install_root/config"
          export XDG_STATE_HOME="$install_root/state"
          install_dir="$install_root/bin"
          sh install.sh --archive dist/bndr_linux_amd64.tar.gz --bin-dir "$install_dir"
          "$install_dir/bndr" --version
          sh install.sh --uninstall --bin-dir "$install_dir"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$VERSION" dist/* --verify-tag --generate-notes "${prerelease[@]}"
          fi
