<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>bndr · Local apps</title>
  <script>
    (() => {
      let preference = 'system';
      try { preference = localStorage.getItem('bndr-theme') || 'system'; } catch {}
      if (!['light', 'dark', 'system'].includes(preference)) preference = 'system';
      document.documentElement.dataset.preference = preference;
      document.documentElement.dataset.theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f6; --surface: #ffffff; --inset: #f0f0ef;
      --text: #252528; --muted: #68686e; --border: #dedee0;
      --control-border: #87878f; --hover: #eaeaec; --primary: #303034; --on-primary: #ffffff;
      --focus: #466da3; --good: #35784d; --error: #a3372a;
      --error-bg: #fff0ed; --selection: #d4dfef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #18181b; --surface: #222225; --inset: #1c1c1f;
      --text: #ebebed; --muted: #ababb4; --border: #3c3c43;
      --control-border: #72727c; --hover: #323237; --primary: #e4e4e8; --on-primary: #252528;
      --focus: #9cb7de; --good: #8fbe9c; --error: #f3afa5;
      --error-bg: #392624; --selection: #3c506e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    ::selection { background: var(--selection); color: var(--text); }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button, .button, select, input {
      border: 1px solid var(--control-border); border-radius: 5px;
      background: var(--surface); min-height: 36px;
    }
    button, .button { padding: 6px 11px; }
    button:hover, .button:hover, select:hover { background: var(--hover); }
    button:active, .button:active { background: var(--inset); }
    button:disabled { cursor: wait; opacity: .6; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    input { cursor: text; padding: 7px 11px; caret-color: var(--text); }
    input::placeholder { color: var(--muted); opacity: 1; }
    input:focus-visible { outline-offset: 1px; }
    select { padding: 5px 28px 5px 10px; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
    .header { border-bottom: 1px solid var(--border); }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; min-height: 76px; }
    .identity, .header-controls { display: flex; align-items: center; gap: 20px; }
    .brand { font-size: 21px; font-weight: 700; letter-spacing: -.035em; }
    .machine { color: var(--muted); font-size: 12px; padding-left: 20px; border-left: 1px solid var(--border); }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .connection::before { content: ""; width: 6px; height: 6px; background: var(--muted); border-radius: 50%; }
    .connection[data-state="connected"]::before { background: var(--good); }
    .theme { display: flex; align-items: center; gap: 9px; }
    .theme label { color: var(--muted); font-size: 12px; }
    main.shell { padding-top: 30px; padding-bottom: 28px; }
    .heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0; letter-spacing: -.02em; }
    .total { color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
    .tabs { display: flex; gap: 20px; align-self: stretch; }
    .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 8px 0; color: var(--muted); white-space: nowrap; }
    .tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
    .tabs button:hover { color: var(--text); }
    .tab-count { font-size: 11px; font-weight: 400; padding-left: 5px; font-variant-numeric: tabular-nums; }
    .search { position: relative; width: 290px; }
    .search svg { position: absolute; top: 11px; left: 11px; color: var(--muted); pointer-events: none; }
    .search input { width: 100%; padding-left: 35px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; align-items: stretch; }
    .card { min-width: 0; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); display: flex; flex-direction: column; position: relative; }
    .card:has(details[open]) { z-index: 2; }
    .preview { display: block; position: relative; aspect-ratio: 8 / 5; background: var(--inset); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; overflow: hidden; }
    a.preview:hover { text-decoration: none; }
    a.preview:focus-visible { outline-offset: 3px; }
    .preview img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .preview-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); padding: 16px; text-align: center; }
    .preview-fallback svg { width: 23px; height: 23px; margin-bottom: 3px; stroke-width: 1.3; }
    .preview-message { font-size: 12px; max-width: 30ch; }
    .body { padding: 17px 17px 12px; flex: 1; display: flex; flex-direction: column; }
    .title-row { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; }
    h2 { font-size: 15px; font-weight: 600; line-height: 1.45; margin: 0; overflow-wrap: anywhere; min-width: 0; }
    .app-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .port { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .url { display: block; color: var(--muted); font-size: 11px; margin-top: 7px; overflow-wrap: anywhere; }
    .app-status { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; margin-top: 12px; }
    .app-status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--good); }
    .offline .app-status::before, .unavailable .app-status::before { background: var(--muted); }
    .card-error { font-size: 12px; margin: 10px 0 0; color: var(--error); overflow-wrap: anywhere; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 17px 15px; gap: 12px; }
    .open-app { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; min-height: 32px; }
    .open-app:hover { text-decoration: none; }
    .utilities { display: flex; gap: 5px; margin-left: auto; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; padding: 7px; min-width: 32px; min-height: 32px; border-color: transparent; background: transparent; }
    details { position: relative; }
    summary { list-style: none; cursor: pointer; border-radius: 5px; }
    summary::-webkit-details-marker { display: none; }
    .options { position: absolute; right: 0; top: calc(100% + 5px); min-width: 175px; padding: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 5px 16px #0002; }
    .options button { display: block; text-align: left; width: 100%; border: 0; background: transparent; font-size: 12px; min-height: 34px; }
    .options button:hover { background: var(--hover); }
    .empty { grid-column: 1 / -1; padding: 65px 24px; text-align: center; color: var(--muted); border-top: 1px solid var(--border); }
    .empty h2 { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 7px; }
    .empty p { margin: 0 auto; max-width: 55ch; font-size: 13px; }
    .empty button { margin-top: 14px; }
    .notice { margin-bottom: 20px; padding: 12px 14px; color: var(--error); background: var(--error-bg); border-radius: 5px; font-size: 13px; }
    footer { margin-top: 28px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
    dialog { width: min(430px, calc(100% - 32px)); padding: 24px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); box-shadow: 0 12px 40px #0003; }
    dialog::backdrop { background: #0006; }
    dialog h2 { font-size: 18px; margin-bottom: 18px; }
    dialog label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 7px; }
    dialog input { display: block; width: 100%; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 0 18px; line-height: 1.6; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
    .primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .primary:hover { background: var(--text); color: var(--on-primary); }
    .text-button { border: 0; padding: 0; min-height: 30px; background: transparent; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .text-button:hover { color: var(--text); background: transparent; }
    .form-error { color: var(--error); font-size: 12px; margin: 10px 0; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: 0 4px 18px #0002; font-size: 13px; z-index: 4; max-width: calc(100% - 32px); }
    @media (max-width: 760px) {
      .shell { padding-left: 20px; padding-right: 20px; }
      .header-inner { gap: 12px; min-height: 68px; }
      .identity, .header-controls { gap: 12px; }
      .machine { border: 0; padding: 0; }
      .connection { font-size: 11px; }
      .theme label { display: none; }
      .theme select { max-width: 100px; font-size: 12px; }
      .grid { gap: 16px; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
    }
    @media (max-width: 520px) {
      .header-inner { flex-wrap: wrap; padding-top: 15px; padding-bottom: 15px; }
      .identity { flex: 1; }
      .header-controls { gap: 10px; }
      .machine { display: none; }
      .connection { font-size: 0; gap: 0; }
      .connection::before { width: 7px; height: 7px; }
      main.shell { padding-top: 24px; }
      .toolbar { align-items: stretch; flex-direction: column-reverse; gap: 14px; margin-bottom: 18px; }
      .search { width: 100%; }
      .tabs { gap: 24px; }
      .grid { grid-template-columns: minmax(0, 1fr); }
      .icon-button { min-width: 40px; min-height: 40px; }
      .open-app { min-height: 40px; }
      .options button { min-height: 40px; }
      footer { line-height: 1.8; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="shell header-inner">
      <div class="identity">
        <span class="brand">bndr</span>
        <span class="machine mono" id="machine">Connecting…</span>
      </div>
      <div class="header-controls">
        <span class="connection" id="status" role="status" data-state="connecting">Connecting</span>
        <div class="theme">
          <label for="theme">Theme</label>
          <select id="theme" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="heading"><h1>Apps</h1><span class="total" id="count"></span></div>
    <div id="notice" class="notice" role="alert" hidden></div>
    <div class="toolbar">
      <nav class="tabs" aria-label="App visibility">
        <button id="visible-tab" aria-pressed="true">Running <span class="tab-count" id="running-count">0</span></button>
        <button id="hidden-tab" aria-pressed="false">Hidden <span class="tab-count" id="hidden-count">0</span></button>
      </nav>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="filter" type="search" placeholder="Filter by name or port…" aria-label="Filter apps" autocomplete="off">
      </div>
    </div>
    <div class="grid" id="apps" role="region" aria-label="Apps" aria-busy="true"></div>
    <footer>Discovery every 3 seconds · Previews about once a minute</footer>
  </main>
  <dialog id="rename-dialog" aria-labelledby="rename-title" aria-describedby="name-hint">
    <form id="rename-form">
      <h2 id="rename-title">Rename app</h2>
      <label for="app-name">App name</label>
      <input id="app-name" maxlength="120" autocomplete="off" aria-describedby="name-hint">
      <p class="hint" id="name-hint">Leave blank to use the page title. This name is saved for this port.</p>
      <button id="reset-name" class="text-button" type="button">Use page title</button>
      <div id="rename-error" class="form-error" role="alert" hidden></div>
      <div class="dialog-actions">
        <button id="cancel-name" type="button">Cancel</button>
        <button class="primary" id="save-name" type="submit">Save name</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const el = id => document.getElementById(id);
    const icons = {
      external: '<path d="M14 4h6v6M20 4 10 14"/><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',
      copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/>',
      more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      page: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>'
    };
    function icon(name) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = icons[name];
      return svg;
    }
    function button(label, action) {
      const node = document.createElement('button');
      node.type = 'button'; node.textContent = label; node.onclick = action;
      return node;
    }
    function externalLink(url) {
      const link = document.createElement('a');
      link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      return link;
    }
    let current = [], saved = [], showingHidden = false, editingPort = null;
    let connected = false, hasLoaded = false, toastTimer, loading = null;
    let mutationVersion = 0;

    // Theme changes are device-local; a blocked storage API still permits switching.
    const preferredScheme = matchMedia('(prefers-color-scheme: dark)');
    el('theme').value = document.documentElement.dataset.preference;
    function applyTheme() {
      const preference = el('theme').value;
      document.documentElement.dataset.theme = preference === 'system'
        ? (preferredScheme.matches ? 'dark' : 'light') : preference;
      document.documentElement.dataset.preference = preference;
    }
    el('theme').onchange = () => {
      applyTheme();
      try { localStorage.setItem('bndr-theme', el('theme').value); } catch {}
    };
    preferredScheme.addEventListener('change', applyTheme);

    function notify(message) {
      clearTimeout(toastTimer);
      el('toast').textContent = message; el('toast').hidden = false;
      toastTimer = setTimeout(() => { el('toast').hidden = true; }, 4000);
    }
    function notice(message) { el('notice').textContent = message; el('notice').hidden = !message; }
    async function updateApp(port, patch) {
      const response = await fetch('/api/apps/' + port, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
      });
      if (!response.ok) throw Error(await response.text() || 'Settings could not be saved. Try again.');
      mutationVersion++;
      for (const app of [...current, ...saved]) {
        if (app.port !== port) continue;
        if ('hidden' in patch) app.hidden = patch.hidden;
        if ('name' in patch) {
          app.customName = patch.name.trim();
          app.name = app.customName || app.autoName || 'App on ' + port;
        }
      }
      saved = saved.filter(app => app.hidden);
      render();
      // A saved mutation succeeds even if the next discovery refresh fails.
      void load().catch(() => {});
    }
    function editName(app) {
      editingPort = app.port;
      el('app-name').value = app.customName || '';
      el('app-name').placeholder = app.autoName || 'App on ' + app.port;
      el('rename-title').textContent = 'Rename app on port ' + app.port;
      el('rename-error').hidden = true;
      el('rename-dialog').showModal();
      el('app-name').focus(); el('app-name').select();
    }
    function makeCard(app) {
      const card = document.createElement('article');
      card.className = 'card' + (app.offline ? ' offline' : app.error ? ' unavailable' : '');
      card.dataset.port = app.port;
      const accessible = !app.offline && !app.error;
      const preview = accessible ? externalLink(app.url) : document.createElement('div');
      preview.className = 'preview';
      if (accessible) preview.setAttribute('aria-label', 'Open ' + app.name);
      const fallback = document.createElement('div'); fallback.className = 'preview-fallback';
      const message = document.createElement('span'); message.className = 'preview-message';
      message.textContent = app.offline ? 'App is offline' : app.hidden ? 'Preview paused' :
        ['queued', 'capturing'].includes(app.preview?.status) ? 'Capturing preview…' :
        app.preview?.error || 'No preview available';
      fallback.append(icon('page'), message); preview.append(fallback);
      if (app.preview?.status === 'ready' && !app.hidden) {
        const image = document.createElement('img'); image.alt = 'Screenshot of ' + app.name;
        image.loading = 'lazy'; image.width = 1200; image.height = 750;
        image.src = '/api/apps/' + app.port + '/preview?v=' + app.preview.version;
        image.onload = () => { fallback.hidden = true; };
        image.onerror = () => { image.remove(); fallback.hidden = false; message.textContent = 'Preview unavailable'; };
        preview.append(image);
      }
      const body = document.createElement('div'); body.className = 'body';
      const row = document.createElement('div'); row.className = 'title-row';
      const heading = document.createElement('h2');
      const name = accessible ? externalLink(app.url) : document.createElement('span');
      name.className = 'app-name'; name.textContent = app.name; name.title = app.name;
      heading.append(name);
      const port = document.createElement('span'); port.className = 'port mono'; port.textContent = ':' + app.port;
      row.append(heading, port);
      const url = document.createElement('span'); url.className = 'url mono';
      url.textContent = app.url || 'Port ' + app.port;
      const status = document.createElement('div'); status.className = 'app-status';
      status.textContent = app.offline ? 'Offline' : app.error ? 'Unavailable' : app.mode === 'proxy' ? 'Bridged to LAN' : 'Available on LAN';
      body.append(row, url, status);
      if (app.error) {
        const error = document.createElement('p'); error.className = 'card-error';
        error.textContent = app.error; body.append(error);
      }
      const footer = document.createElement('div'); footer.className = 'card-footer';
      if (accessible) {
        const open = externalLink(app.url); open.className = 'open-app button';
        open.append('Open app', icon('external')); footer.append(open);
      }
      const utilities = document.createElement('div'); utilities.className = 'utilities';
      if (accessible) {
        const copy = button('', async () => {
          try { await navigator.clipboard.writeText(app.url); notify('Link copied'); }
          catch { window.prompt('Copy app URL', app.url); }
        });
        copy.className = 'icon-button'; copy.title = 'Copy link';
        copy.setAttribute('aria-label', 'Copy link for ' + app.name); copy.append(icon('copy')); utilities.append(copy);
      }
      const details = document.createElement('details');
      const summary = document.createElement('summary'); summary.className = 'icon-button';
      summary.title = 'App options'; summary.setAttribute('aria-label', 'Options for ' + app.name); summary.append(icon('more'));
      const options = document.createElement('div'); options.className = 'options';
      options.append(button('Rename', () => { details.open = false; editName(app); }));
      const hide = button(app.hidden ? 'Restore app' : 'Hide app', async () => {
        hide.disabled = true;
        const wasHidden = app.hidden;
        try {
          await updateApp(app.port, { hidden: !wasHidden });
          notify(wasHidden ? 'App restored' : 'App hidden. Restore it from Hidden.');
          details.open = false;
          (showingHidden ? el('hidden-tab') : el('visible-tab')).focus();
        } catch (error) { hide.disabled = false; notify(error.message); }
      });
      options.append(hide); details.append(summary, options); utilities.append(details); footer.append(utilities);
      card.append(preview, body, footer);
      return card;
    }
    function emptyState(title, text, retry = false) {
      const empty = document.createElement('div'); empty.className = 'empty';
      const heading = document.createElement('h2'); heading.textContent = title;
      const paragraph = document.createElement('p'); paragraph.textContent = text;
      empty.append(heading, paragraph);
      if (retry) empty.append(button('Try again', () => void load().catch(() => {})));
      return empty;
    }
    function render() {
      const query = el('filter').value.trim().toLowerCase();
      const visible = current.filter(app => !app.hidden);
      const hidden = [...current.filter(app => app.hidden), ...saved];
      const candidates = showingHidden ? hidden : visible;
      const apps = candidates.filter(app => [app.name, app.autoName, app.upstream, app.url, app.port].join(' ').toLowerCase().includes(query));
      el('count').textContent = hasLoaded ? current.length + ' discovered' : '';
      el('running-count').textContent = visible.length;
      el('hidden-count').textContent = hidden.length;
      el('visible-tab').setAttribute('aria-pressed', !showingHidden);
      el('hidden-tab').setAttribute('aria-pressed', showingHidden);
      el('apps').setAttribute('aria-busy', !hasLoaded && connected);
      if (!apps.length) {
        el('apps').replaceChildren(!hasLoaded
          ? connected ? emptyState('Loading apps', 'Checking local services…') : emptyState('Cannot connect to bndr', 'Check that bndr is running. This page will reconnect automatically.', true)
          : query ? emptyState('No matching apps', 'Try another name, port or address.')
          : showingHidden ? emptyState('No hidden apps', 'Use an app’s options to hide it. You can restore it here later.')
          : emptyState('No apps running', 'Start a local HTTP server. It will appear here automatically.'));
        return;
      }
      const container = el('apps');
      container.querySelector('.empty')?.remove();
      const keep = new Set(apps.map(app => String(app.port)));
      for (const card of [...container.children]) if (!keep.has(card.dataset.port)) card.remove();
      for (const [index, app] of apps.entries()) {
        let card = [...container.children].find(node => node.dataset.port === String(app.port));
        const signature = JSON.stringify(app);
        // Preserve focus and open controls during polling. Reuse unchanged images too.
        if (!card || (card.dataset.signature !== signature && !card.contains(document.activeElement) && !card.querySelector('details[open]'))) {
          const next = makeCard(app); next.dataset.signature = signature;
          if (card) card.replaceWith(next);
          card = next;
        }
        if (container.children[index] !== card) container.insertBefore(card, container.children[index] || null);
      }
    }
    async function load() {
      if (loading) return loading;
      const generation = mutationVersion;
      loading = (async () => {
        try {
          const response = await fetch('/api/apps', { signal: AbortSignal.timeout(8000) });
          if (!response.ok) throw Error('Dashboard unavailable');
          const data = await response.json();
          if (generation !== mutationVersion) return;
          current = data.apps; saved = data.savedApps || [];
          connected = true; hasLoaded = true;
          el('machine').textContent = data.lan + ':' + data.port;
          if (el('status').textContent !== 'Watching') el('status').textContent = 'Watching';
          el('status').dataset.state = 'connected';
          notice(data.error ? 'Discovery failed: ' + data.error + '. Retrying automatically.' : '');
          render();
        } catch (error) {
          connected = false;
          if (el('status').textContent !== 'Reconnecting') el('status').textContent = 'Reconnecting';
          el('status').dataset.state = 'disconnected';
          notice('Connection lost. Check that bndr is running. Retrying automatically.');
          render(); throw error;
        }
      })().finally(() => { loading = null; });
      return loading;
    }
    async function refresh() {
      try { await load(); } catch {}
      setTimeout(refresh, 3000);
    }
    el('visible-tab').onclick = () => { showingHidden = false; render(); };
    el('hidden-tab').onclick = () => { showingHidden = true; render(); };
    el('filter').addEventListener('input', render);
    el('cancel-name').onclick = () => el('rename-dialog').close();
    el('reset-name').onclick = () => { el('app-name').value = ''; el('app-name').focus(); };
    el('rename-dialog').addEventListener('close', () => {
      const card = [...el('apps').children].find(node => node.dataset.port === String(editingPort));
      card?.querySelector('summary')?.focus();
    });
    el('rename-form').onsubmit = async event => {
      event.preventDefault();
      const controls = [el('save-name'), el('reset-name'), el('app-name')];
      controls.forEach(control => { control.disabled = true; });
      el('save-name').textContent = 'Saving…';
      el('rename-error').hidden = true;
      try {
        await updateApp(editingPort, { name: el('app-name').value });
        el('rename-dialog').close(); notify('App name saved');
      } catch (error) {
        el('rename-error').textContent = error.message; el('rename-error').hidden = false;
      } finally {
        controls.forEach(control => { control.disabled = false; });
        el('save-name').textContent = 'Save name';
      }
    };
    document.addEventListener('click', event => {
      for (const details of document.querySelectorAll('details[open]')) if (!details.contains(event.target)) details.open = false;
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || el('rename-dialog').open) return;
      for (const details of document.querySelectorAll('details[open]')) { details.open = false; details.querySelector('summary').focus(); }
    });
    connected = true; render(); refresh();
  </script>
</body>
</html>
